_schema-version: 3.3.0
ID: erp
description: A simple CAP project.
version: 1.0.0
modules:
- name: erp-srv
  type: nodejs
  path: gen/srv
  requires:
  - name: erp-db
  - name: erp-auth
  provides:
  - name: srv-api
    properties:
      srv-url: ${default-url}
  parameters:
    buildpack: nodejs_buildpack
    instances: 1
  build-parameters:
    builder: npm-ci
- name: erp-db-deployer
  type: hdb
  path: gen/db
  requires:
  - name: erp-db
  parameters:
    buildpack: nodejs_buildpack
- name: erp-app-content
  type: com.sap.application.content
  path: .
  requires:
  - name: erp-repo-host
    parameters:
      content-target: true
  build-parameters:
    build-result: resources
    requires:
    - artifacts:
      - comcementserpproductsmanageproducts.zip
      name: comcementserpproductsmanageproducts
      target-path: resources/
    - artifacts:
      - comcementserpplantsmanageplants.zip
      name: comcementserpplantsmanageplants
      target-path: resources/
- name: comcementserpproductsmanageproducts
  type: html5
  path: app/manageproducts
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
- name: comcementserpplantsmanageplants
  type: html5
  path: app/manageplants
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
resources:
- name: erp-db
  type: com.sap.xs.hdi-container
  parameters:
    service: hana
    service-plan: hdi-shared
- name: erp-auth
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      oauth2-configuration:
        credential-types:
        - binding-secret
        - x509
      tenant-mode: dedicated
      xsappname: erp-${org}-${space}
    path: ./xs-security.json
    service: xsuaa
    service-plan: application
- name: erp-repo-host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-name: erp-html5-service
    service-plan: app-host
- name: erp-destination-service
  type: org.cloudfoundry.managed-service
  requires:
  - name: srv-api
  parameters:
    config:
      HTML5Runtime_enabled: true
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          - Authentication: OAuth2UserTokenExchange
            Name: srv-api
            ProxyType: Internet
            Type: HTTP
            URL: ~{srv-api/srv-url}
            HTML5.DynamicDestination: true
            HTML5.ForwardAuthToken: true
          existing_destinations_policy: update
      version: 1.0.0
    service: destination
    service-name: erp-destination-service
    service-plan: lite
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
  - builder: custom
    commands:
    - npm ci
    - npx cds build --production
